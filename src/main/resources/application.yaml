spring:
  application:
    name: api-spring-boot
  datasource:
    url: jdbc:postgresql://localhost:5432/meubanco
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl_auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect